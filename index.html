<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revix</title>
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#090b11">
<meta name="author" content="shvndn">
<style>
:root{--bg:#090b11;--card:#131722;--card2:#1c2130;--line:rgba(255,255,255,.07);--tx:#f4f6fb;--mu:#8a92a6;--ac:#7f9dff;--ac2:#b08cff;--on:#080a10;--ok:#4fd1a1;--warn:#f2b45a;--warnbg:rgba(242,180,90,.14);--bad:#ff7b7b;--glass:rgba(16,19,29,.74);--hero:linear-gradient(150deg,#222a4a,#131722 62%);--sh:0 18px 40px -22px rgba(0,0,0,.8);--ease:cubic-bezier(.22,.9,.25,1)}
@media(prefers-color-scheme:light){:root{--bg:#f2f3f8;--card:#fff;--card2:#eef0f6;--line:rgba(12,18,40,.08);--tx:#0d1122;--mu:#687086;--ac:#3f5cff;--ac2:#8a5cff;--on:#fff;--ok:#12a679;--warn:#b7791f;--warnbg:rgba(224,150,30,.14);--bad:#e0453f;--glass:rgba(255,255,255,.78);--hero:linear-gradient(150deg,#e3e9ff,#fff 62%);--sh:0 18px 40px -22px rgba(40,60,140,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:22px 18px 120px}
main.sw{animation:fd .28s var(--ease)}
h1{font-size:36px;letter-spacing:-.03em;margin:6px 0 2px;font-weight:750;line-height:1.1}
h2{font-size:20px;letter-spacing:-.015em;margin:30px 0 10px;font-weight:700}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:10px}
.card.row{padding:14px 14px 14px 16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero{display:flex;align-items:center;gap:20px;background:var(--hero);border-radius:28px;padding:20px;margin-top:18px;box-shadow:var(--sh)}
.rw{position:relative;width:118px;height:118px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.rt{stroke:var(--line)}
.rf{stroke:url(#rg);stroke-dasharray:327;animation:rg 1.1s var(--ease) .1s backwards}
.hc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.hc .big{font-size:34px}.hs{font-size:18px;font-weight:700;letter-spacing:-.01em}
.big{font-size:34px;font-weight:750;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--card2);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;animation:gw .9s var(--ease) backwards}
button{font:inherit;font-weight:600;background:var(--ac);color:var(--on);border:0;border-radius:999px;padding:10px 18px;min-height:40px;cursor:pointer;transition:transform .15s var(--ease),opacity .15s}
button:active{transform:scale(.95);opacity:.85}
button.g{background:var(--card2);color:var(--tx)}
button.d{background:var(--card2);color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;background:var(--card2);color:var(--tx);border:1px solid transparent;border-radius:12px;padding:11px 12px;margin:4px 0 12px;min-height:44px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(127,157,255,.2);outline:0}
label{font-size:14px;color:var(--mu)}
.chip{display:inline-block;font-size:12px;font-weight:600;background:var(--card2);border-radius:20px;padding:2px 10px;margin:8px 6px 0 0;color:var(--mu)}
.chip.i{background:var(--warnbg);color:var(--warn)}
#strip{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(18px);backdrop-filter:saturate(1.8) blur(18px);border-bottom:1px solid var(--line);padding:8px 12px;font-size:13px;font-weight:600;color:var(--warn);overflow:hidden;white-space:nowrap;text-align:left}
.trk{display:inline-flex;white-space:nowrap;animation:mq linear infinite}.si{padding-right:80px}
.fb{display:block;text-align:center;background:var(--card2);border-radius:12px;padding:11px;color:var(--tx);cursor:pointer;margin:4px 0 12px;font-weight:600}
#viewer{color:#f4f6fb;position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.88);display:none;padding:16px;overflow:auto;animation:fd .2s}
nav{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--glass);-webkit-backdrop-filter:saturate(1.8) blur(22px);backdrop-filter:saturate(1.8) blur(22px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:transparent;color:var(--mu);border-radius:14px;padding:6px 2px;font-size:11px;font-weight:600;min-height:50px}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .35s var(--ease)}
nav button.on{color:var(--ac)}nav button.on svg{transform:translateY(-1px) scale(1.12)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:5;animation:fd .22s}
.sheet>div{position:relative;background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:26px 18px calc(20px + env(safe-area-inset-bottom,0px));animation:up .42s var(--ease)}
.sheet>div::before{content:"";position:absolute;top:8px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:5px;background:var(--line)}
.stk{position:sticky;bottom:-20px;margin:12px -18px -20px;padding:12px 18px calc(18px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.wm{text-align:center;color:var(--mu);opacity:.55;font-size:12px;font-weight:600;letter-spacing:.02em;margin:40px 0 0;user-select:none}
.up{color:var(--ok)}.dn{color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#warn{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:none;background:var(--bad);color:#fff;padding:9px 12px;font-size:13px;font-weight:600;text-align:center}
@keyframes fd{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes rg{from{stroke-dashoffset:327}}
@keyframes gw{from{width:0}}
@keyframes mq{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style></head>
<body><div id="warn" role="alert"></div><div id="strip"></div><main id="app"></main><div id="viewer" onclick="if(event.target===this)closeView()"></div><nav id="nav"></nav><div id="sheet"></div>
<script>
const K='studytracker_v1';
const iso=d=>{const x=new Date(d);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const T=()=>iso(Date.now());
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((new Date(a+'T12:00:00')-new Date(b+'T12:00:00'))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STREAMS={Commerce:['Business Studies','Accountancy','Economics'],Arts:['Economics','History','Political Science','Geography']};
let S,loadErr=0,saveBad=0;
function norm(o){o=o&&typeof o==='object'?o:{};const dt=x=>typeof x==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x)?x:null,st=STREAMS[o.stream]?o.stream:'Commerce',obj=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
 const tp=(Array.isArray(o.topics)?o.topics:[]).filter(t=>t&&typeof t==='object'&&t.id&&t.name).map(t=>({id:String(t.id).replace(/[^\w-]/g,'_'),subj:String(t.subj||''),ch:String(t.ch||'General'),name:String(t.name),diff:['Easy','Medium','Hard'].includes(t.diff)?t.diff:'Medium',imp:!!t.imp,studied:!!t.studied,stage:Math.max(0,+t.stage||0),last:dt(t.last),due:dt(t.due),notes:String(t.notes||''),
  qs:(Array.isArray(t.qs)?t.qs:[]).filter(q=>q&&q.id&&((q.type==='text'||q.type==='link')?typeof q.v==='string':(q.type==='img'||q.type==='pdf'))).map(q=>({...q,id:String(q.id).replace(/[^\w-]/g,'_')})),
  logs:(Array.isArray(t.logs)?t.logs:[]).filter(l=>l&&dt(l.d)).map(l=>({d:l.d,h:+l.h||0,self:+l.self||0,quiz:(l.quiz===null||l.quiz===undefined||l.quiz==='')?null:+l.quiz}))}));
 tp.forEach(t=>{if(t.studied){if(!t.last)t.last=(t.logs.length&&t.logs[t.logs.length-1].d)||T();if(!t.due)t.due=addD(t.last,ivl(t))}});
 return{stream:st,subs:STREAMS[st],topics:tp,hours:Object.fromEntries(Object.entries(obj(o.hours)).filter(([k,v])=>dt(k)&&+v>0).map(([k,v])=>[k,+v])),goal:Math.max(.5,+o.goal||3),exam:Object.fromEntries(Object.entries(obj(o.exam)).filter(([k,v])=>dt(v))),done:obj(o.done)}}
let r0=null,noStore=0;try{r0=localStorage.getItem(K)}catch(e){noStore=1}
try{S=norm(r0?JSON.parse(r0):{})}catch(e){loadErr=1;S=norm({});try{localStorage.setItem(K+'_bad',r0)}catch(x){}}
const vt=()=>S.topics.filter(t=>S.subs.includes(t.subj));
const warn=m=>{const e=document.getElementById('warn');if(!e)return;e.textContent=m||'';e.style.display=m?'block':'none'};
const save=()=>{if(loadErr)return;try{mirror()}catch(e){}try{localStorage.setItem(K,JSON.stringify(S));if(saveBad){saveBad=0;warn('')}}catch(e){saveBad=1;warn('Could not save. Storage is blocked or full. Copy a backup from More now.')}};
let WM=noStore?'Storage is blocked here, so nothing will be saved. Open this file in Chrome or use the installed app.':loadErr?'Your saved data could not be read, so changes are not being saved. Restore a backup in More.':'';
warn(WM);
window.addEventListener('error',e=>warn('Error: '+(e.message||'unknown')));
let armed=null;function twice(k){if(armed===k){armed=null;warn(WM);return true}armed=k;warn('Tap delete again to confirm');setTimeout(()=>{if(armed===k){armed=null;warn(WM)}},3000);return false}
function setStream(v){if(!STREAMS[v])return;S.stream=v;S.subs=STREAMS[v];rvS=null;rvI=null;save();render()}
let tab='today',logId=null;
const LB='studytracker_lb';
// 4 backup nudge
const lbDays=()=>{try{const v=localStorage.getItem(LB);return v?diffD(T(),v):null}catch(e){return null}};
const lbText=()=>{const n=lbDays();return n===null?'No backup made yet.':n===0?'Last backup: today.':'Last backup: '+n+' days ago.'};
function bkNudge(){const n=lbDays();if(!S.topics.length||(n!==null&&n<7))return '';return `<div class="card row"><div><b>Back up your data</b><div class="mu">${lbText()}</div></div><button onclick="tab='more';render()">Back up</button></div>`}
const $=id=>document.getElementById(id);

// Adaptive revision: base gap grows with each good review, shrinks for hard or important topics
function ivl(t){const b=[1,3,7,21,45][Math.min(t.stage,4)];let f=1;if(t.diff==='Hard')f*=.6;if(t.diff==='Easy')f*=1.5;if(t.imp)f*=.7;return Math.max(1,Math.round(b*f))}
function sc(l){const a=[];if(l.self)a.push(l.self/5);if(l.quiz!==null&&l.quiz!==undefined&&l.quiz!=='')a.push(l.quiz/100);return a.length?a.reduce((x,y)=>x+y)/a.length:null}
function logStudy(t,h,self,quiz){
  const l={d:T(),h,self,quiz};t.logs.push(l);
  if(h)S.hours[T()]=(S.hours[T()]||0)+h;
  const p=sc(l);
  if(!t.studied){t.studied=true;t.stage=0}
  else if(p===null||p>=.5)t.stage++;else t.stage=0;
  t.last=T();t.due=addD(T(),ivl(t));save();
}
function chips(t){return (t.diff==='Hard'?'<span class="chip">Hard</span>':'')+(t.imp?'<span class="chip i">Important</span>':'')+(t.studied?`<span class="chip">Revise ${t.due<=T()?'today':'on '+t.due}</span>`:'<span class="chip">Not studied yet</span>')}
function row(t,extra){return `<div class="card row"><div><b>${esc(t.name)}</b><div class="mu">${esc(t.subj)}, ${esc(t.ch)}${extra||''}</div>${chips(t)}</div><button onclick="openLog('${t.id}')">Log</button></div>`}

const ready=t=>{if(!t.studied)return 0;const a=t.logs.map(sc).filter(x=>x!==null),b=a.length?a[a.length-1]:.6;return Math.max(0,b-Math.max(0,diffD(T(),t.due))*.04)};
function streak(){let n=0,d=T();if(!S.hours[d])d=addD(d,-1);while(S.hours[d]>0){n++;d=addD(d,-1)}return n}
function del(k,id){S[k]=S[k].filter(x=>x.id!==id);save();render()}
const ckey=(s,c)=>s+'|'+c;
function togDone(k){k=decodeURIComponent(k);S.done[k]=!S.done[k];save();render()}
let openSyl={};
function syl(){return S.subs.map(s=>{
 const base=(SYL[s]||[]),extra=[...new Set(S.topics.filter(t=>t.subj===s&&!base.includes(t.ch)).map(t=>t.ch))],all=base.concat(extra),
 dn=all.filter(c=>S.done[ckey(s,c)]).length,tp=S.topics.filter(t=>t.subj===s),st=tp.filter(t=>t.studied),rd=st.length?st.reduce((a,t)=>a+ready(t),0)/st.length:null;
 return `<div class="card"><div class="row"><b>${esc(s)}</b><span class="mu">${dn} of ${all.length} chapters complete</span></div><div class="bar"><i style="width:${all.length?dn/all.length*100:0}%;background:var(--ok)"></i></div>
 <div class="mu" style="margin-top:8px">${st.length} of ${tp.length} added topics studied${rd===null?'':', average readiness '+Math.round(rd*100)+'%'}</div>
 <details ${openSyl[s]?'open':''} ontoggle="openSyl['${esc(s)}']=this.open" style="margin-top:8px"><summary class="mu">Chapters</summary>${all.map(c=>{const l=tp.filter(t=>t.ch===c),ls=l.filter(t=>t.studied),r=ls.length?Math.round(ls.reduce((a,t)=>a+ready(t),0)/ls.length*100):null,d=S.done[ckey(s,c)];
 return `<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><div><div>${esc(c)}</div><div class="mu">${ls.length} of ${l.length} topics studied${r===null?'':', readiness '+r+'%'}</div></div><button class="${d?'':'g'}" style="padding:4px 10px" onclick="togDone('${encodeURIComponent(ckey(s,c)).replace(/'/g,'%27')}')">${d?'Done':'Mark done'}</button></div>`}).join('')}</details></div>`}).join('')}
let stripList=[];
function strip(){const ex=S.subs.map(s=>[s,S.exam[s]]).filter(x=>x[1]&&x[1]>=T()).sort((a,b)=>a[1]<b[1]?-1:1),el=$('strip');
 if(!ex.length){el.style.display='none';stripList=[];return}
 const l=ex.map(([s,d])=>{const n=diffD(d,T());return `${s} exam: ${n===0?'today':n===1?'1 day remaining':n+' days remaining'}`});
 el.style.display='block';
 if(l.join('|')!==stripList.join('|')){stripList=l;
  const px=l.reduce((a,x)=>a+x.length*7+80,0),k=Math.max(1,Math.ceil(420/px)),half=l.map(x=>`<span class="si">${esc(x)}</span>`).join('').repeat(k);
  el.innerHTML=`<div class="trk" style="animation-duration:${Math.max(8,Math.round(px*k/45))}s">${half+half}</div>`}}
setInterval(strip,60000);
let calM=0,selD=null;
function dayInfo(d){const L=[];S.topics.forEach(t=>t.logs.forEach((l,i)=>{if(l.d===d)L.push({t,l,rev:i>0})}));return L}
function cal(){
 const n0=new Date(),f=new Date(n0.getFullYear(),n0.getMonth()+calM,1),y=f.getFullYear(),m=f.getMonth(),n=new Date(y,m+1,0).getDate(),ex=S.subs.map(s=>S.exam[s]),dd=selD||T();
 let c='',tot=0,sd=0,hit=0,bh=0;
 for(let i=0;i<f.getDay();i++)c+='<span></span>';
 for(let d=1;d<=n;d++){const k=iso(new Date(y,m,d,12)),h=S.hours[k]||0,r=h/S.goal;
  if(h>0){tot+=h;sd++;if(r>=1)hit++;bh=Math.max(bh,h)}
  c+=`<button aria-label="${k}, ${+h.toFixed(1)} hours studied" aria-pressed="${k===dd}" onclick="selD='${k}';render()" style="padding:0;aspect-ratio:1;border-radius:8px;font-size:13px;background:${!h?'var(--line)':r<.5?'#4a5a8a':r<1?'#8fa8ff':'#5cc79a'};color:${h?(r<.5?'#fff':'#0d1020'):'var(--mu)'};${k===T()?'outline:2px solid var(--tx);':''}${k===dd?'box-shadow:0 0 0 2px var(--ac);':''}${ex.includes(k)?'border:2px solid var(--warn);':''}">${d}</button>`}
 const L=dayInfo(dd),dh=S.hours[dd]||0,bs={};L.forEach(x=>bs[x.t.subj]=(bs[x.t.subj]||0)+(x.l.h||0));
 const nw=L.filter(x=>!x.rev),rv=L.filter(x=>x.rev),li=a=>a.map(x=>`<div class="mu">${esc(x.t.name)} (${esc(x.t.subj)})</div>`).join('')||'<div class="mu">None</div>';
 const box=(v,l)=>`<div class="card"><div class="big">${v}</div><div class="mu">${l}</div></div>`;
 return `<div class="card"><div class="row"><button class="g" onclick="calM--;render()">Prev</button><b style="white-space:nowrap">${f.toLocaleString('default',{month:'long',year:'numeric'})}</b><button class="g" onclick="calM++;render()">Next</button></div>
 <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px">${'SMTWTFS'.split('').map(x=>`<span class="mu" style="text-align:center">${x}</span>`).join('')}${c}</div>
 <div class="mu" style="margin-top:10px">Grey: none. Dark blue: under half your goal. Light blue: over half. Green: goal met. Yellow ring: exam day.</div></div>
 <div class="two">${box(+tot.toFixed(1)+'h','studied this month')}${box(sd,'days studied')}${box(hit,'days goal met')}${box(+bh.toFixed(1)+'h','best day')}</div>
 <div class="card"><b>${new Date(dd+'T12:00:00').toDateString()}</b><div class="mu">${+dh.toFixed(2)}h of ${S.goal}h goal</div>
 <div style="margin-top:8px"><b>Subjects</b>${Object.keys(bs).map(k=>`<div class="mu">${esc(k)}: ${+bs[k].toFixed(2)}h</div>`).join('')||'<div class="mu">None</div>'}</div>
 <div style="margin-top:8px"><b>New topics (${nw.length})</b>${li(nw)}</div><div style="margin-top:8px"><b>Revised (${rv.length})</b>${li(rv)}</div>
 </div>`}
const idb=new Promise(r=>{try{const q=indexedDB.open('studyfiles',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
const fput=(k,v)=>idb.then(d=>d?new Promise(r=>{const x=d.transaction('f','readwrite').objectStore('f').put(v,k);x.onsuccess=()=>r(1);x.onerror=()=>r(0)}):0);
const fget=k=>idb.then(d=>d?new Promise(r=>{const x=d.transaction('f').objectStore('f').get(k);x.onsuccess=()=>r(x.result);x.onerror=()=>r(null)}):null);
const fdel=k=>idb.then(d=>{if(d)d.transaction('f','readwrite').objectStore('f').delete(k)});
const curT=()=>S.topics.find(x=>x.id===logId);
let draft=null;
function qHtml(t,ro,l){const N={img:'Photo',pdf:'PDF',link:'Link',text:'Text'};return (l||t.qs||[]).map(q=>`<div class="row" style="margin:6px 0;gap:8px"><span class="mu" style="overflow:hidden;text-overflow:ellipsis;min-width:0">${N[q.type]}: ${esc(q.type==='text'||q.type==='link'?q.v.slice(0,60):q.name)}</span><span style="white-space:nowrap"><button class="g" style="padding:2px 8px" onclick="viewQ('${q.id}','${ro?t.id:''}')">View</button>${ro?'':` <button class="d" style="padding:2px 8px" onclick="delQ('${q.id}')">X</button>`}</span></div>`).join('')||'<div class="mu">Nothing saved yet.</div>'}
const drawQs=()=>{const e=$('qs'),t=curT();if(e&&t&&draft)e.innerHTML=qHtml(t,0,draft.qs)};
const qmsg=m=>{const e=$('qm');if(e)e.textContent=m};
function addQtext(){const v=$('qt').value.trim();if(!v||!draft)return;draft.qs.push({id:'q'+Date.now(),type:/^https?:\/\/\S+$/i.test(v)?'link':'text',v});$('qt').value='';drawQs()}
function addQfile(inp){const f=inp.files[0];if(!f||!draft)return;
 if(f.size>15e6){qmsg('File is over 15 MB, too large.');inp.value='';return}
